# Publishes the website/ folder (landing page, privacy policy, terms) to GitHub Pages.
# One-time setup in GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish website

# The website is served by the FinGist Worker (backend/wrangler.toml [assets]); this optional
# GitHub Pages copy only runs when started by hand (Actions → Publish website → Run workflow)
# after enabling Pages (Settings → Pages → Source: GitHub Actions).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
