name = "fingist-api"
main = "src/worker.ts"
compatibility_date = "2025-11-01"

# Runs every 2 minutes. Each source also has its own poll interval (see src/config/sources.ts),
# so official/regulator feeds are checked less often than fast news feeds.
# The website (landing page, privacy policy, terms) is served by this same Worker:
#   /  /privacy  /terms   (files from ../website; API paths such as /v1/feed are not affected)
[assets]
directory = "../website"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[triggers]
crons = ["*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fingist"
database_id = "404ec4e9-908e-4e81-be5b-b22a9e80969d"
migrations_dir = "migrations"

# The Worker calls itself so each feed / AI batch runs as its own invocation
# (keeps each one inside the free plan's per-invocation CPU limit).
[[services]]
binding = "SELF"
service = "fingist-api"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_FALLBACK_MODEL = "gemini-2.5-flash"
MAX_AGE_HOURS = "48"
ENRICH_BATCH_SIZE = "8"
ENRICH_BATCHES_PER_TICK = "3"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   GEMINI_API_KEY  - Google AI Studio key
#   INTERNAL_KEY    - any long random string; protects /internal/* routes
